<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Sales Treemap</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">Movie Sales Treemap</h1>
      <p id="description">Top 100 Highest Grossing Movies Grouped by Genre</p>
    </header>
    
    <div class="viz-container">
      <div id="treemap-container"></div>
      <div id="tooltip"></div>
    </div>
    
    <div id="legend-container">
      <div id="legend"></div>
    </div>
    
    <footer>
      <p>Data source: <a href="https://www.boxofficemojo.com/" target="_blank">Box Office Mojo</a></p>
    </footer>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
